<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب معدل التقنية الميكانيكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f4f6f9; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: flex-start; }
        
        .app-container { 
            background: #ffffff; 
            max-width: 500px; 
            width: 100%; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            border-top: 8px solid #4a5568; 
            margin-top: 10px;
        }
        
        .nav-back-wrapper { text-align: left; margin-bottom: 15px; }
        .nav-back { color: #4a5568; text-decoration: none; font-size: 14px; font-weight: 700; }
        
        .page-title { 
            font-size: 22px; 
            text-align: center; 
            margin-bottom: 25px; 
            color: #4a5568; 
            font-weight: 700; 
            line-height: 1.5;
        }
        
        .inputs-container { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .field-item { flex: 1; text-align: center; }
        .field-item label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 13px; 
            font-weight: 700; 
            color: #333; 
            line-height: 1.4;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 13px; 
            text-align: center; 
            color: #333; 
            background: #fff;
            outline: none;
        }
        input::placeholder { color: #aaa; font-size: 11px; }
        
        .section-label { 
            font-size: 15px; 
            margin-bottom: 15px; 
            color: #333; 
            font-weight: 700; 
        }
        
        .row-course { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 15px; 
            background: #f8fafc; 
            border: 1px solid #edf2f7;
            border-radius: 8px; 
            margin-bottom: 12px; 
            gap: 15px; 
        }
        .course-label-text { 
            flex: 2; 
            font-size: 13px; 
            font-weight: 600; 
            color: #4a5568; 
            text-align: right;
        }
        .course-selector { 
            flex: 1; 
            max-width: 140px; 
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            color: #4a5568;
            background: #f1f5f9;
            font-weight: bold;
            outline: none;
            text-align: center;
        }
        
        .trigger-calc-btn { 
            width: 100%; 
            color: white; 
            background: #4a5568; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 4px 12px rgba(74,85,104,0.2); 
        }
        .trigger-calc-btn:hover { background: #333c4d; }
        
        .report-box { 
            display: none; 
            margin-top: 25px; 
            padding: 20px; 
            background: #f0fdf4; 
            border: 1px solid #bbf7d0; 
            border-radius: 12px; 
            text-align: center; 
        }
        .report-meta { font-size: 14px; color: #475569; margin-bottom: 5px; }
        .report-main { font-size: 26px; font-weight: 700; color: #166534; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-back-wrapper">
        <a href="index.html" class="nav-back">⬅️ العودة للرئيسية</a>
    </div>
    
    <h2 class="page-title">🔧 حساب معدل التقنية<br>الميكانيكية</h2>

    <div class="inputs-container">
        <div class="field-item">
            <label>المعدل التراكمي السابق<br>(من 5):</label>
            <input type="number" id="prev-gpa" step="0.01" min="0" max="5" placeholder="اتركه فارغاً إذا كنت مستـ...">
        </div>
        <div class="field-item">
            <label>الساعات المكتسبة<br>السابقة:</label>
            <input type="number" id="prev-hours" min="0" placeholder="اتركه فارغاً إذا كنت مستـ...">
        </div>
    </div>

    <h3 class="section-label">المواد الحالية المعتمدة بالخطة:</h3>
    
    <div id="courses-container">
        <div class="row-course" data-hours="4">
            <select class="course-selector"><option value="5">A+ (+امتياز مرتف</option><option value="4.75">A (امتياز)</option><option value="4.5">B+ (جيد جداً مرتف</option><option value="4">B (جيد جداً)</option><option value="3.5">C+ (جيد مرتفع)</option><option value="3">C (جيد)</option><option value="2.5">D+ (مقبول مرتفع)</option><option value="2">D (مقبول)</option><option value="1">F (راسب)</option></select>
            <span class="course-label-text">تقنية النمذجة والقطع (4 ساعات)</span>
        </div>
        <div class="row-course" data-hours="3">
            <select class="course-selector"><option value="5">A+ (+امتياز مرتف</option><option value="4.75">A (امتياز)</option><option value="4.5">B+ (جيد جداً مرتف</option><option value="4">B (جيد جداً)</option><option value="3.5">C+ (جيد مرتفع)</option><option value="3">C (جيد)</option><option value="2.5">D+ (مقبول مرتفع)</option><option value="2">D (مقبول)</option><option value="1">F (راسب)</option></select>
            <span class="course-label-text">الهيدروليك والنيوماتيك (3 ساعات)</span>
        </div>
        <div class="row-course" data-hours="4">
            <select class="course-selector"><option value="5">A+ (+امتياز مرتف</option><option value="4.75">A (امتياز)</option><option value="4.5">B+ (جيد جداً مرتف</option><option value="4">B (جيد جداً)</option><option value="3.5">C+ (جيد مرتفع)</option><option value="3">C (جيد)</option><option value="2.5">D+ (مقبول مرتفع)</option><option value="2">D (مقبول)</option><option value="1">F (راسب)</option></select>
            <span class="course-label-text">ميكانيكا محركات السيارات (4 ساعات)</span>
        </div>
        <div class="row-course" data-hours="2">
            <select class="course-selector"><option value="5">A+ (+امتياز مرتف</option><option value="4.75">A (امتياز)</option><option value="4.5">B+ (جيد جداً مرتف</option><option value="4">B (جيد جداً)</option><option value="3.5">C+ (جيد مرتفع)</option><option value="3">C (جيد)</option><option value="2.5">D+ (مقبول مرتفع)</option><option value="2">D (مقبول)</option><option value="1">F (راسب)</option></select>
            <span class="course-label-text">السلامة الصناعية (2 ساعة)</span>
        </div>
    </div>

    <button class="trigger-calc-btn" onclick="calculateGpa()">احسب المعدل والعزم الميكانيكي</button>

    <div id="gpa-report" class="report-box">
        <div class="report-meta">المعدل الفصلي: <span id="sem-gpa">0.00</span></div>
        <div class="report-main">المعدل التراكمي الإجمالي: <span id="cum-gpa">0.00</span></div>
    </div>
</div>

<script>
    function calculateGpa() {
        let prevGpa = parseFloat(document.getElementById('prev-gpa').value) || 0;
        let prevHours = parseFloat(document.getElementById('prev-hours').value) || 0;
        let totalPoints = 0, totalHours = 0;
        
        document.querySelectorAll('.row-course').forEach(row => {
            let hours = parseFloat(row.getAttribute('data-hours'));
            let grade = parseFloat(row.querySelector('.course-selector').value);
            totalPoints += (grade * hours);
            totalHours += hours;
        });
        
        let semGpa = totalPoints / totalHours;
        let cumGpa = semGpa;
        
        if (prevHours > 0 && prevGpa > 0) {
            cumGpa = ((prevGpa * prevHours) + totalPoints) / (prevHours + totalHours);
        }
        
        document.getElementById('sem-gpa').innerText = semGpa.toFixed(2);
        document.getElementById('cum-gpa').innerText = cumGpa.toFixed(2);
        document.getElementById('gpa-report').style.display = 'block';
    }
</script>
</body>
</html>
